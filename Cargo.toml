[package]
name = "logshard"
version = "1.0.3"
edition = "2024"
rust-version = "1.94"
description = "Token-efficient, AI-guided log analysis"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
github-copilot-sdk = "1.0.10-preview.0"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
toml = "1.1"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
lto = "thin"
strip = "symbols"
