[package]
name = "logshard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Token-efficient, AI-guided log analysis"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
lto = "thin"
strip = "symbols"

